# Claude Peers 브로커용 리버스 프록시
#
# 채널 서버는 broker_url 의 http 를 ws 로 바꿔 /stream 에 연결한다.
# 따라서 https 로 노출하면 자동으로 wss 가 된다.
#
# /etc/nginx/sites-available/claude-peers 로 두고 sites-enabled 에 링크한다.

server {
    listen 443 ssl http2;
    server_name peers.example.internal;   # ← 사내 도메인으로 바꾼다

    ssl_certificate     /etc/ssl/certs/peers.crt;
    ssl_certificate_key /etc/ssl/private/peers.key;

    # 질문 본문 4000자, 컨텍스트 12000자, 답변 16000자.
    # 브로커도 64KB 에서 413 을 내므로 맞춰 둔다.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade 가 통과해야 한다. 이게 없으면 세션이 하나도 안 붙는다.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 세션이 몇 시간씩 붙어 있다. 브로커가 30초마다 ping 을 보내지만
        # 프록시가 먼저 끊으면 소용없다. 이 값이 30초보다 짧으면
        # connect/disconnect 가 끝없이 반복된다.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}

# http 로 들어오면 https 로 보낸다.
# 평문으로 붙으면 개인 토큰이 암호화 없이 전송된다.
server {
    listen 80;
    server_name peers.example.internal;   # ← 사내 도메인으로 바꾼다
    return 301 https://$host$request_uri;
}
